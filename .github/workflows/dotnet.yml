
name: RaceDay CI

on:
  push:
    branches:
      - main
      - part3-mvc-application
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.slnx

      - name: Build solution
        run: dotnet build RaceDay.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.slnx --configuration Release --no-build

      - name: Build API Docker image
        run: docker build -f Dockerfile.api -t raceday-api:ci .

      - name: Build MVC Docker image
        run: docker build -f Dockerfile.mvc -t raceday-mvc:ci .
